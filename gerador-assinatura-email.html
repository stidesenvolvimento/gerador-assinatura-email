    const $=id=>document.getElementById(id), form=$('generator'), locationEl=$('location'), sector=$('sector'), coord=$('coord'), csmb=$('csmb');
    const groups=['setores','pontos_de_leitura','bosques_de_leitura','casas_de_cultura','centros_culturais','teatros','unidades','equipamentos'];
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const option=(value,text)=>{const el=document.createElement('option');el.value=value;el.textContent=text;return el};
    Object.entries(locations).forEach(([key,item])=>locationEl.append(option(key,item.nome||key)));
    roles.forEach(role=>$('roles').append(option(role,role)));
    function resetSelect(el,label){el.replaceChildren(option('',label))}
    locationEl.addEventListener('change',()=>{
      resetSelect(sector,'Selecione o setor');resetSelect(coord,'Selecione...');resetSelect(csmb,'Selecione...');
      $('coord-wrap').classList.add('hidden');$('csmb-wrap').classList.add('hidden');$('sector-wrap').classList.remove('hidden');
      const key=locationEl.value,item=locations[key]||{};
      if(key==='csmb'){$('sector-wrap').classList.add('hidden');$('coord-wrap').classList.remove('hidden');[['bibliotecas','Biblioteca'],['pontos_de_leitura','Ponto de Leitura'],['bosques_de_leitura','Bosque de Leitura'],['outros','Outros Setores']].forEach(x=>coord.append(option(...x)));return}
      Object.entries(item.setores||{}).forEach(([key,value])=>sector.append(option(key,value.nome)));
    });
    coord.addEventListener('change',()=>{resetSelect(csmb,'Selecione...');const data=locations.csmb||{},items=coord.value==='outros'?(data.setores||{}):(data[coord.value]||{});Object.entries(items).forEach(([key,value])=>csmb.append(option(key,value.nome)));$('csmb-wrap').classList.toggle('hidden',!Object.keys(items).length)});
    $('phone').addEventListener('input',event=>{let v=event.target.value.replace(/\D/g,'').slice(0,11);event.target.value=v.length<=2?(v?'('+v:''):v.length<=6?'('+v.slice(0,2)+') '+v.slice(2):v.length<=10?'('+v.slice(0,2)+') '+v.slice(2,6)+'-'+v.slice(6):'('+v.slice(0,2)+') '+v.slice(2,7)+'-'+v.slice(7)});
    function selectedInfo(){const root=locations[locationEl.value]||{};let selected=null;if(locationEl.value==='csmb'){const source=coord.value==='outros'?'setores':coord.value;selected=(root[source]||{})[csmb.value]||null}else{for(const group of groups){if((root[group]||{})[sector.value]){selected=root[group][sector.value];break}}}return{root,selected,address:selected?.endereco||root.endereco||'',cep:selected?.cep||root.cep||'',sectorName:selected?.nome||''}}
    form.addEventListener('reset',()=>setTimeout(()=>{locationEl.dispatchEvent(new Event('change'));$('result').classList.add('hidden')},0));
    form.addEventListener('submit',event=>{event.preventDefault();const phone=$('phone').value,digits=phone.replace(/\D/g,'');if(phone&&![10,11].includes(digits.length)){alert('Preencha o telefone com 10 ou 11 dígitos.');return}if(locationEl.value==='csmb'&&(!coord.value||!csmb.value)){alert('Selecione a coordenação e o local.');return}if(locationEl.value!=='csmb'&&!sector.value){alert('Selecione o setor / unidade interna.');return}
      const info=selectedInfo(),name=escapeHtml($('name').value.toLocaleUpperCase('pt-BR')),role=escapeHtml($('role').value.toLocaleUpperCase('pt-BR')),sectorName=info.sectorName?' / '+escapeHtml(info.sectorName.toLocaleUpperCase('pt-BR')):'';
      $('signature').innerHTML=`<table cellspacing="0" cellpadding="0"><tr><td style="vertical-align:middle;padding-right:16px"><img src="${signatureLogo}" alt="Prefeitura SP" class="signature-logo"></td><td style="font-family:Arial,sans-serif;color:#000"><div style="margin-bottom:2px"><span style="font-family:Arial Black,Arial,sans-serif;font-size:14px;font-weight:900;display:block;line-height:22px">${name}</span></div><div style="font-size:10px;font-weight:bold;margin-bottom:8px;line-height:18px">${role}${sectorName}</div><div style="font-size:10px;line-height:18px">${escapeHtml($('email').value)}</div>${phone?`<div style="font-size:10px;line-height:18px"><strong>Tel.:</strong> ${escapeHtml(phone)}</div>`:''}<div style="font-size:10px;line-height:18px">${escapeHtml(info.address)}</div><div style="font-size:10px;line-height:18px">${escapeHtml(info.cep)}</div><div style="font-size:10px;line-height:18px"><a href="https://www.prefeitura.sp.gov.br/cultura" style="color:#307095;text-decoration:underline">www.prefeitura.sp.gov.br/cultura</a></div></td></tr></table>`;
      $('result').classList.remove('hidden');$('status').textContent='';$('result').scrollIntoView({behavior:'smooth',block:'start'});
    });
    $('copy').addEventListener('click',async()=>{const el=$('signature'),status=$('status');try{if(navigator.clipboard&&window.ClipboardItem){const html=new Blob([el.innerHTML],{type:'text/html'}),plain=new Blob([el.innerText],{type:'text/plain'});await navigator.clipboard.write([new ClipboardItem({'text/html':html,'text/plain':plain})])}else{const range=document.createRange();range.selectNodeContents(el);const selection=getSelection();selection.removeAllRanges();selection.addRange(range);document.execCommand('copy');selection.removeAllRanges()}status.textContent='Assinatura copiada com sucesso!'}catch(error){status.textContent='Não foi possível copiar automaticamente. Selecione a prévia e copie com Ctrl+C.'}});
  </script>
